<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
     
</head>
<body>
    <div class="card">
        <h1>Edit Task</h1>
        <form class="add-form" action="{{ url_for('edit_todo', todo_id=todo.id) }}" method="POST">
            <input type="text" name="task" value="{{ todo.task }}" required autofocus>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
        <a href="{{ url_for('get_todos') }}" class="back-link">Back to list</a>


    </div>
    
</body>
</html>
